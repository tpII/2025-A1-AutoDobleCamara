<!DOCTYPE html>
<html>
<head>
    <title>Control de Robot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="camera-view">
            <img id="camera-feed" src="/stream" alt="Camera Feed">
        </div>
        <div class="controls">
            <div class="buttons">
                <button id="forward">⬆️</button>
                <div class="middle-row">
                    <button id="left">⬅️</button>
                    <button id="stop">⏹️</button>
                    <button id="right">➡️</button>
                </div>
                <button id="backward">⬇️</button>
            </div>
            <div class="speed-control">
                <label for="speed">Velocidad:</label>
                <input type="range" id="speed" min="0" max="255" value="128">
                <span id="speed-value">128</span>
            </div>
        </div>
    </div>
    <script src="robot-control.js"></script>
</body>
</html>
