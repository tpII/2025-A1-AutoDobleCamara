[env:esp32s3]
platform = espressif32
framework = arduino

board = 4d_systems_esp32s3_gen4_r8n16

board_build.mcu = esp32s3
board_build.flash_size = 16MB

board_build.flash_mode = qio

board_build.psram_type = opi

monitor_speed = 115200
monitor_filters = 
    colorize          
    esp32_exception_decoder  

build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_RUNNING_CORE=1      
    -DARDUINO_EVENT_RUNNING_CORE=1
    
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM
    
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=16384
    -DOPENCV_DISABLE_EIGEN=1
    -DOPENCV_NO_LAPACK=1
    
    -I$PROJECT_DIR/lib/esp32-opencv/esp32/lib/release_build/opencv
    -L$PROJECT_DIR/lib/esp32-opencv/esp32/lib/release_build/opencv
    -L$PROJECT_DIR/lib/esp32-opencv/esp32/lib/release_build/opencv/3rdparty
    -lopencv_imgcodecs
    -lopencv_imgproc
    -lopencv_core
    -llibpng
    -lzlib

lib_deps = 
    https://github.com/espressif/esp32-camera.git
    
lib_extra_dirs = 
    lib/esp32-opencv/esp32/lib/release_build
    
upload_speed = 921600

lib_ldf_mode = deep+